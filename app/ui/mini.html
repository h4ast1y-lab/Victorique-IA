<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Victorique · conversa rápida</title>
  <link rel="icon" href="/api/avatar/photo">
  <link rel="stylesheet" href="/ui/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/ui/css/style.css">
  <link rel="stylesheet" href="/ui/css/mini.css">
</head>
<body class="mini">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V17h5v-1.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
    </defs>
  </svg>

  <div class="mini-app">
    <header class="mini-head">
      <img class="mini-avatar" src="/api/avatar/photo" alt="">
      <div class="mini-title">
        <strong id="miniName">Victorique</strong>
        <small id="miniStatus">Conversa rápida</small>
      </div>
      <button type="button" class="icon-btn" id="btnMiniNew" title="Começar outra conversa rápida" aria-label="Nova conversa rápida">
        <svg class="ic"><use href="#i-plus"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btnMiniExpand" title="Abrir na janela grande" aria-label="Abrir na janela grande" disabled>
        <svg class="ic"><use href="#i-expand"/></svg>
      </button>
    </header>

    <div class="mini-thread" id="miniThread">
      <p class="mini-empty" id="miniEmpty">Diga logo. E que seja interessante.</p>
      <div class="messages-list" id="miniMessages"></div>
    </div>

    <div class="mini-auth" id="miniAuth" hidden>
      <svg class="ic"><use href="#i-shield"/></svg>
      <span>Ela precisa da sua autorização para continuar.</span>
      <button type="button" class="btn btn-primary btn-sm" id="btnMiniAuth">Ver na janela grande</button>
    </div>

    <form class="composer mini-composer" id="miniForm">
      <textarea id="miniInput" rows="1" placeholder="Fale com a Victorique" aria-label="Mensagem"></textarea>
      <div class="composer-bar">
        <div class="composer-left">
          <button type="button" class="pill-btn think-toggle" id="btnMiniThink" aria-pressed="false"
                  title="Pensamento profundo: ela pensa em voz alta antes de responder">
            <svg class="ic ic-sm"><use href="#i-bulb"/></svg>
            <span>Pensamento profundo</span>
          </button>
        </div>
        <div class="composer-right">
          <button type="submit" class="send-btn" id="btnMiniSend" title="Enviar" aria-label="Enviar">
            <svg class="ic"><use href="#i-up"/></svg>
          </button>
          <button type="button" class="send-btn stop" id="btnMiniStop" title="Parar resposta" aria-label="Parar resposta" hidden>
            <svg class="ic"><use href="#i-stop"/></svg>
          </button>
        </div>
      </div>
    </form>
  </div>

  <script src="/ui/vendor/katex/katex.min.js"></script>
  <script src="/ui/js/markdown.js"></script>
  <script src="/ui/js/thought.js"></script>
  <script src="/ui/js/mini.js"></script>
</body>
</html>
