[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The Windows ACL on the project folder breaks pytest's cache directory
# (WinError 183). The cache is not needed, so the provider is disabled.
addopts = -p no:cacheprovider
filterwarnings =
    ignore::pytest.PytestDeprecationWarning
